[package]
name = "headset-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows HID transport and device resolution for headset-protocol, with a fixture-driven fake backend."

[dependencies]
# One-way: the device layer builds on the pure protocol crate. The reverse
# dependency stays forbidden so `headset-protocol` keeps zero OS access.
headset-protocol = { path = "../headset-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
