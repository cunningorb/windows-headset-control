[workspace]
resolver = "2"
members = [
    "crates/headset-protocol",
    "crates/headset-device",
    "crates/headset-cli",
    "crates/headset-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental native Windows HID controller for supported wireless headset settings."
repository = "https://github.com/cunningorb/windows-headset-control"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1", features = ["json"] }

# Pinned to 0.58 deliberately. See Global Constraints. `windows` 0.59+ uses
# `raw-dylib` linkage, which requires `dlltool.exe`; this environment's
# `x86_64-pc-windows-gnu` toolchain does not have one. For the same reason,
# `Cargo.lock`'s precise pins for `windows-sys`, `windows-targets`, and
# `console` (an `insta` dev-dependency transitively pulling in `getrandom`),
# plus `.cargo/config.toml`'s `getrandom_backend = "windows_legacy"` setting,
# all exist to keep the whole dependency tree off `raw-dylib` on this target.
# A routine `cargo update` that bumps any of those past the pinned version
# reintroduces the `dlltool.exe` requirement and breaks the build; don't
# "clean up" these pins without re-checking that constraint first.
windows = { version = "0.58", features = [
    # Direct2D's brush constructors are gated behind this: their properties
    # struct carries a Matrix3x2 from Foundation::Numerics.
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    # Added for the tray (Phase 2). These are *features* of the already-pinned
    # 0.58, not a version bump and not a new crate: the tray draws its own icon
    # and builds its own menus rather than taking a tray-icon dependency, and
    # reaches microphone mute through Core Audio because mute is a USB Audio
    # Class control, not a vendor command. See docs/device-research.md.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    # Phase 3: the custom-drawn panel. Features of the pinned 0.58, not crates.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # DPI awareness. A feature of the pinned 0.58, not a crate. The manifest
    # route is unavailable on x86_64-pc-windows-gnu, which has no
    # /MANIFEST:EMBED, so the process opts in at runtime through
    # SetProcessDpiAwarenessContext instead.
    "Win32_UI_HiDpi",
    # High contrast detection, so the panel does not keep drawing its own
    # low-contrast greys at users who chose high contrast to escape them.
    "Win32_UI_Accessibility",
] }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
