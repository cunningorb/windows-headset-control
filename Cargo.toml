[workspace]
resolver = "2"
members = [
    "crates/headset-protocol",
    "crates/headset-device",
    "crates/headset-cli",
    "crates/headset-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
# No `license` key: this is a private, proprietary, unpublished workspace
# (`publish = false` above). "UNLICENSED" is an npm/package.json convention,
# not a valid SPDX license expression, so it does not belong in `license`.
# Omitting the key entirely is the conventional way to say "proprietary" in
# a Cargo manifest.

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1", features = ["json"] }

# Pinned to 0.58 deliberately. See Global Constraints. `windows` 0.59+ uses
# `raw-dylib` linkage, which requires `dlltool.exe`; this environment's
# `x86_64-pc-windows-gnu` toolchain does not have one. For the same reason,
# `Cargo.lock`'s precise pins for `windows-sys`, `windows-targets`, and
# `console` (an `insta` dev-dependency transitively pulling in `getrandom`),
# plus `.cargo/config.toml`'s `getrandom_backend = "windows_legacy"` setting,
# all exist to keep the whole dependency tree off `raw-dylib` on this target.
# A routine `cargo update` that bumps any of those past the pinned version
# reintroduces the `dlltool.exe` requirement and breaks the build; don't
# "clean up" these pins without re-checking that constraint first.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    # Added for the tray (Phase 2). These are *features* of the already-pinned
    # 0.58, not a version bump and not a new crate: the tray draws its own icon
    # and builds its own menus rather than taking a tray-icon dependency, and
    # reaches microphone mute through Core Audio because mute is a USB Audio
    # Class control, not a vendor command. See docs/device-research.md.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
